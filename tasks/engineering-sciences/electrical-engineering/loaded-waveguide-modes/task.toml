schema_version = "1.4"

artifacts = ["/root/results/modes.json"]

[task]
name = "turing/loaded-waveguide-modes"
description = "Mode analysis of rectangular waveguides loaded with lossy microwave laminates, argon discharge cells, magnetised YIG slabs and magnetised argon discharges: every mode with attenuation at most 200 dB/m at each test frequency and in each direction, as alpha + j beta with its per-layer power split (dispersion relations and fields to be derived; nonreciprocal hybrid modes of gyrotropic guides, one-way surface magnetoplasmons, backward waves, evanescent modes, lossy surface waves)."
version = "4.0.0"
authors = [{ name = "Abdrahim Temami", email = "abdrahim.t@turing.com" }]
keywords = ["waveguides", "microwave-engineering", "lse-lsm-modes", "transverse-resonance", "lossy-waveguides", "plasma-loaded-waveguides", "ferrite-devices", "magnetoplasma", "hybrid-modes", "poynting-flux", "nonreciprocal-waveguides", "surface-waves", "backward-waves", "complex-modes", "electromagnetics"]

