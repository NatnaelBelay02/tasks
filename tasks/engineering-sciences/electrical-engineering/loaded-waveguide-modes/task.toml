schema_version = "1.4"

artifacts = ["/root/results/modes.json"]

[task]
name = "turing/loaded-waveguide-modes"
description = "Mode analysis of rectangular waveguides loaded with lossy microwave laminates, argon discharge cells and magnetised YIG slabs: every mode with attenuation at most 200 dB/m at each test frequency and in each direction, as alpha + j beta (dispersion relations to be derived; nonreciprocal ferrite guides, backward waves, evanescent modes, lossy surface waves)."
version = "3.0.0"
authors = [{ name = "Abdrahim Temami", email = "abdrahim.t@turing.com" }]
keywords = ["waveguides", "microwave-engineering", "lse-lsm-modes", "transverse-resonance", "lossy-waveguides", "plasma-loaded-waveguides", "ferrite-devices", "nonreciprocal-waveguides", "surface-waves", "backward-waves", "complex-modes", "electromagnetics"]

