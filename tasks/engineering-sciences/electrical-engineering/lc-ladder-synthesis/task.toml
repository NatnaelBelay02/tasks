schema_version = "1.4"

artifacts = ["/root/results/synthesize.py"]

[task]
name = "turing/lc-ladder-synthesis"
description = "Write an insertion-loss filter synthesis program: generalized elliptic (Cauer) approximation with equiripple passband and stopbands, the finite transmission zeros placed by the program (weighted Remez coupled with stopband equalization), Feldtkeller spectral factorization and Darlington ladder extraction with zero shifting at infinity and at dc, choosing a canonical transformerless ladder with an admissible load, at a working precision adequate for narrow IF filters of degree up to 16; graded on held-out low-pass and band-pass specifications."
version = "4.1.0"
authors = [{ name = "Abdrahim Temami", email = "abdrahim.t@turing.com" }]
keywords = ["filter-synthesis", "network-synthesis", "darlington-synthesis", "lc-ladder", "generalized-chebyshev", "elliptic-filters", "remez-algorithm", "zero-shifting", "rf-filters", "circuit-theory", "numerical-conditioning"]

